<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Kampf um Liechtenstein</title>
<meta name="description" content="Elf Gemeinden, ein Land. Gebietsstrategie auf echten Geodaten Liechtensteins.">
<style>
@font-face{font-family:"PressStart";src:url("fonts/press-start-2p.woff2?v=dev") format("woff2");font-display:block}
:root{
  --bg:#000; --panel:#0d0d1c; --panel2:#1d2b53; --frame:#c2c3c7; --text:#fff1e8; --dim:#83769c;
  --hi:#ffec27; --red:#ff004d; --blue:#29adff; --good:#00e436; --warn:#ffa300;
  --px:"PressStart", monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--px);font-size:10px;line-height:1.7;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:none;-moz-osx-font-smoothing:grayscale;font-smooth:never;text-rendering:optimizeSpeed}
button,input{font:inherit;color:inherit;cursor:pointer}
img.spr{image-rendering:pixelated;image-rendering:crisp-edges;vertical-align:middle;display:inline-block}
[hidden]{display:none!important}
.screen{position:absolute;inset:0}
/* Rahmen wie bei den Heimcomputern: schwarz, hell, schwarz */
.px{background:var(--panel);box-shadow:0 0 0 2px #000,0 0 0 4px var(--frame),0 0 0 6px #000}
.px-btn{font-family:var(--px);font-size:10px;line-height:1;background:var(--panel2);color:var(--text);border:0;padding:10px 12px;box-shadow:0 0 0 2px #000,0 0 0 4px var(--frame),0 0 0 6px #000}
.px-btn:hover,.px-btn:focus-visible{background:var(--hi);color:#000;outline:none}
.px-btn.red{background:var(--red);color:#fff}
.px-btn:disabled{opacity:.4;cursor:default}
.px-x{position:absolute;right:10px;top:10px;width:26px;height:26px;border:0;background:var(--red);color:#fff;font-family:var(--px);font-size:10px;line-height:26px;padding:0;box-shadow:0 0 0 2px #000}
.trow{display:flex;gap:16px;flex-wrap:wrap;padding:4px}
.crt::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0 1px,transparent 1px 3px)}
@keyframes blink{50%{opacity:0}}

/* ---------- Intro und Menü ---------- */
#intro{background:#000;z-index:20;overflow:hidden}
#ic{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges}
#press{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;background:#000;font-size:12px;color:var(--hi)}
#press .blink{animation:blink 1s steps(1) infinite}
#press small{font-size:8px;color:var(--dim)}
#titleTxt{position:absolute;left:0;right:0;top:9%;text-align:center;pointer-events:none}
#titleTxt .t1{font-size:clamp(10px,2.4vw,16px);color:var(--hi);text-shadow:2px 2px 0 #000;letter-spacing:4px}
#titleTxt .t2{font-size:clamp(16px,5.2vw,48px);color:#fff;margin-top:12px;text-shadow:0 4px 0 var(--red),0 8px 0 var(--blue),4px 12px 0 #000;letter-spacing:2px;line-height:1.2}
#titleTxt.drop{animation:drop 1.1s steps(9) both}
@keyframes drop{0%{transform:translateY(-300px)}70%{transform:translateY(16px)}85%{transform:translateY(-6px)}100%{transform:none}}
#story{position:absolute;left:50%;transform:translateX(-50%);top:36%;width:min(560px,90%);text-align:center;font-size:clamp(8px,1.5vw,12px);line-height:2.4;color:var(--text);text-shadow:2px 2px 0 #000;min-height:6em}
#menu{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);width:min(380px,90%);padding:16px 12px 12px;display:flex;flex-direction:column;gap:4px}
#menu button.mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 8px;font-size:10px;color:var(--text)}
#menu button.mi::before{content:">";color:transparent;width:12px}
#menu button.mi.on,#menu button.mi:hover{color:var(--hi);background:var(--panel2)}
#menu button.mi.on::before,#menu button.mi:hover::before{color:var(--red);animation:blink .6s steps(1) infinite}
#menu .foot{font-size:8px;color:var(--dim);text-align:center;margin-top:8px;line-height:1.8}
#panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(580px,92%);max-height:84%;overflow:auto;padding:22px 18px 16px;z-index:22}
#panel h2{font-size:14px;color:var(--hi);margin:0 0 16px;font-weight:400}
#panel h3{font-size:10px;color:var(--blue);margin:18px 0 6px;font-weight:400}
#panel p{margin:0;font-size:9px;line-height:1.9}
#panel a{color:var(--blue)}
.gsub{margin-bottom:12px!important}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:4px}
.gcard{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:#000;padding:10px 6px;box-shadow:0 0 0 2px var(--c)}
.gcard:hover,.gcard:focus-visible{background:var(--panel2);outline:none}
.gcard .gn{font-size:9px;color:var(--c)}.gcard .gl{font-size:7px;color:var(--dim);text-align:center;line-height:1.6}
.ghead{display:flex;gap:16px;align-items:flex-start;margin-bottom:6px}.ghead img{flex:none;box-shadow:0 0 0 2px #000,0 0 0 4px var(--frame)}
.ghead h2{margin:4px 0 4px!important;font-size:12px!important;line-height:1.6}.ghead .gn{font-size:10px}.gt{font-size:8px;color:var(--dim)}
.gq{color:var(--text);margin-top:8px!important;font-size:8px!important}
#panel ul{margin:0;padding-left:16px;font-size:9px;line-height:1.9}
.gst{display:grid;grid-template-columns:auto auto 1fr;gap:6px 10px;align-items:center;font-size:8px}.gst b{font-weight:400;color:var(--hi);text-align:right}
.bar{display:inline-flex;gap:2px}.bar i{width:10px;height:10px;background:#1d2b53}.bar i.on{background:var(--hi)}
.gname{font-size:7px!important;color:var(--dim);margin-top:10px!important}
.gnav{margin-top:10px;justify-content:space-between}.gnav #pClose{flex:1}
@media(max-width:520px){.gplay{flex:1}}
@media(max-width:520px){.ghead{flex-direction:column;align-items:center;text-align:center}.ggrid{grid-template-columns:repeat(2,1fr)}.gst{grid-template-columns:1fr auto;}.gst .bar{display:none}}#panel .cr p{margin-bottom:8px}#panel .cr b{color:var(--hi);font-weight:400}
.hs{width:100%;border-collapse:collapse;font-size:9px}
.hs td,.hs th{padding:5px 4px;text-align:left;white-space:nowrap}.hs th{font-size:8px;color:var(--dim);font-weight:400}
.hs td.n{color:var(--hi)}.hs td.s{text-align:right}
.hs tr:nth-child(2) td{color:var(--hi)}.hs tr.new td{background:var(--panel2);animation:blink 1s steps(1) 6}
.hs i{display:inline-block;width:8px;height:8px;margin-right:6px;vertical-align:middle}
.hsinfo{font-size:8px;color:var(--dim);margin-top:10px}

/* ---------- Spiel ---------- */
#warScreen{background:#000}
#wc{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#wc3{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#wTip{position:fixed;z-index:5;background:var(--panel);font-size:8px;padding:6px 8px;pointer-events:none;line-height:1.8;box-shadow:0 0 0 2px #000,0 0 0 4px var(--frame)}
#wMsg{left:50%;top:50%;transform:translate(-50%,-50%);padding:18px 20px;max-width:360px;text-align:center;position:absolute;line-height:2}
#wChoose{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);padding:14px;display:flex;flex-direction:column;gap:10px;width:min(660px,calc(100% - 36px))}
#wChoose b{font-size:11px;color:var(--hi);font-weight:400}#wChoose span{color:var(--dim);font-size:8px}
.wgems{display:flex;flex-wrap:wrap;gap:10px;padding:2px}
.wgems button{border:0;background:#000;color:var(--text);padding:5px 8px 5px 5px;font-size:8px;box-shadow:0 0 0 2px var(--c);display:flex;align-items:center;gap:6px}
.wgems button:hover{background:var(--c);color:#000}
#wHud{position:absolute;top:12px;left:12px;right:12px;display:flex;align-items:center;gap:16px;padding:6px 10px;flex-wrap:nowrap}
#wHud .wst{white-space:nowrap;font-size:10px;display:flex;align-items:center;gap:6px}#wHud .wst b{font-weight:400}
#wName{font-size:10px;font-weight:400}
#wGrow,#wGoldR{font-size:8px;color:var(--good)}#wGrow.full{color:var(--red);animation:blink 1s steps(1) infinite}
#wAtt{font-size:8px;color:var(--red)}
#wScoreBox b{color:var(--hi)}
.tbtn{border:0;background:var(--panel2);color:var(--text);height:26px;min-width:26px;padding:0 8px;font-size:10px;box-shadow:0 0 0 2px #000,0 0 0 4px var(--frame)}
#w3d{margin-left:auto}
#wBoard{position:absolute;top:calc(var(--th,58px) + 14px);right:14px;padding:8px 10px;font-size:8px;min-width:230px;max-height:calc(100% - var(--th,58px) - var(--bh,110px) - 30px);overflow:auto}
#wBoard div{display:flex;align-items:center;gap:6px;padding:3px 0;cursor:pointer;white-space:nowrap}
#wBoard i{width:8px;height:8px;flex:none}#wBoard em{font-style:normal;color:var(--dim);min-width:22px}
#wBoard span{margin-left:auto}#wBoard .tr{min-width:44px;text-align:right;color:var(--dim)}
#wBoard .me{color:var(--hi)}#wBoard .dead{opacity:.35}
#wBoard div button{border:0;background:var(--panel2);padding:2px 3px;margin-left:4px;line-height:0;box-shadow:0 0 0 2px #000}
#wBoard div button:disabled{opacity:.35}#wBoard div button.ph{visibility:hidden}
#wBoard .pact{color:var(--good)}
#wBoard .more{display:block;width:100%;border:0;background:none;color:var(--blue);font-size:8px;padding:8px 0 0;text-align:left}
#wBoard .goal{color:var(--dim);border-top:2px solid var(--panel2);margin-top:6px;padding-top:6px;cursor:default}
#wFeed{position:absolute;left:14px;top:calc(var(--th,58px) + 14px);display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:min(400px,60%)}
#wFeed div{background:#000;color:var(--text);font-size:8px;line-height:1.8;padding:5px 8px;box-shadow:0 0 0 2px var(--panel2);transition:opacity 1s}
#wFeed div.bad{box-shadow:0 0 0 2px var(--red);color:#ffb0c0}#wFeed div.good{box-shadow:0 0 0 2px var(--good)}#wFeed div.warn{box-shadow:0 0 0 2px var(--warn);color:#ffd890}#wFeed div.old{opacity:.35}
#wFeed div.ask{background:var(--panel2);box-shadow:0 0 0 2px var(--hi);pointer-events:auto}
#wFeed div.ask button{border:0;background:var(--hi);color:#000;font-size:8px;padding:4px 6px;margin-left:6px;box-shadow:0 0 0 2px #000}
#wFeed div.ask button.no{background:#000;color:var(--text)}
#wBottom{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:18px;align-items:center;padding:8px 12px;width:max-content;max-width:calc(100% - 28px)}
.wr{display:flex;flex-direction:column;font-size:8px;gap:6px;min-width:170px}.wr b{font-weight:400;color:var(--hi)}
.wr input{width:100%;accent-color:var(--red)}
#wBuild{display:flex;gap:10px}
#wBuild button{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:#000;padding:6px 8px;min-width:78px;box-shadow:0 0 0 2px var(--panel2)}
#wBuild button span{font-size:8px}#wBuild button em{font-style:normal;font-size:7px;color:var(--dim);white-space:nowrap}#wBuild button small{font-size:8px;color:var(--hi)}
#wBuild button{position:relative}#wBuild button[data-left]::after{content:attr(data-left);position:absolute;top:3px;right:4px;font-size:7px;color:var(--hi)}
#wBuild button[aria-pressed="true"]{background:var(--panel2);box-shadow:0 0 0 2px var(--hi)}#wBuild button.poor{opacity:.35}
#wTut{position:absolute;left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 28px));padding:16px 16px 12px;z-index:6;background:#000;box-shadow:0 0 0 2px #000,0 0 0 4px var(--hi),0 0 0 6px #000}
#wTut.top{top:calc(var(--th,58px) + 14px)}#wTut.bottom{bottom:calc(var(--bh,110px) + 14px)}#wTut{max-height:calc(100% - var(--th,58px) - var(--bh,110px) - 30px);overflow:auto}
#wTut h3{margin:4px 34px 10px 0;font-size:11px;color:var(--hi);font-weight:400;line-height:1.6}
#wTut p{margin:0 0 14px;font-size:9px;line-height:2}#wTut .tn{font-size:8px;color:var(--dim)}
.tutHi{outline:2px solid var(--hi)!important;outline-offset:6px;position:relative;z-index:5;animation:hi .5s steps(1) infinite}
@keyframes hi{50%{outline-color:var(--red)}}
#wBanner{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:clamp(18px,6vw,44px);line-height:1.2;pointer-events:none;z-index:7;text-shadow:4px 4px 0 #000,-2px -2px 0 #000;letter-spacing:2px}
#wBanner.go{animation:bn 2.6s steps(12) forwards}
@keyframes bn{0%{transform:scale(3);opacity:0}15%{transform:scale(1);opacity:1}25%{opacity:.2}35%{opacity:1}80%{opacity:1}100%{opacity:0}}
.wlvl{display:flex;gap:10px;padding:2px;flex-wrap:wrap}.wlvl button{border:0;background:#000;color:var(--dim);font-size:8px;padding:6px 8px;box-shadow:0 0 0 2px var(--panel2)}
.wlvl button[aria-pressed="true"]{color:#000;background:var(--hi);box-shadow:0 0 0 2px var(--hi)}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:30;padding:18px}
.mcard{width:min(540px,100%);max-height:calc(100% - 36px);overflow:auto;padding:22px 18px 16px;display:flex;flex-direction:column;gap:14px}
.mcard h2{margin:0;font-size:14px;line-height:1.7;font-weight:400}
.mcard h2.win{color:var(--hi)}.mcard h2.lose{color:var(--red)}
.sc{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:9px}.sc b{font-weight:400;text-align:right}
.sc .tot{font-size:12px;color:var(--hi);margin-top:8px}
.ini{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:9px;color:var(--hi)}
.ini input{width:92px;font-size:16px;text-transform:uppercase;letter-spacing:6px;background:#000;color:var(--hi);border:0;padding:8px;box-shadow:0 0 0 2px var(--hi);text-align:center}
#toasts{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:40;pointer-events:none;align-items:center}
.toast{background:#000;color:var(--text);font-size:8px;padding:7px 10px;box-shadow:0 0 0 2px var(--frame);animation:tin .2s steps(3)}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
@media(max-width:700px){
  #wHud{gap:8px;padding:5px 6px;top:10px;left:10px;right:10px}#wHud .wst{font-size:8px;gap:4px}#wHud #wName,#wHud #wAtt,#wHud #wGoldR,#wHud #wLandBox{display:none}
  #wHud img.spr{width:12px;height:12px}#wGrow{font-size:7px}
  .tbtn{min-width:24px;padding:0 6px}#wExit{order:-3}#wHelp{order:-2;margin-left:0}#w3d{order:-1;margin-left:0}#wScoreBox{margin-left:auto}
  #wBuild button em{display:none}
  #wBoard{top:auto;bottom:calc(var(--bh,128px) + 14px);right:10px;min-width:0;padding:6px 8px;max-height:45%}
  #wBoard.open{top:calc(var(--th,54px) + 14px);bottom:auto;max-height:calc(100% - var(--th,54px) - var(--bh,128px) - 30px);z-index:4}
  #wFeed{top:auto;bottom:calc(var(--bh,128px) + 14px);left:10px;max-width:50%}#wFeed div{font-size:7px}#wFeed div:nth-child(n+3){display:none}
  #wBottom{left:10px;right:10px;transform:none;width:auto;flex-direction:column;align-items:stretch;gap:10px;bottom:10px}
  #wBuild button{flex:1;min-width:0}
  #menu button.mi{font-size:9px}
  .hs{font-size:8px}.hs td,.hs th{padding:4px 2px}
}
@media(max-width:400px){#wBuild{gap:6px}#wBuild button{padding:6px 2px}#wBuild button span{font-size:7px}#wHud{gap:3px;padding:5px 4px}#wHud .tbtn{padding:0 5px}#wHud img.spr{width:10px;height:10px}#wHud .wst{font-size:7px}#wGrow{font-size:6px}}
@media(max-height:520px){
  #wTut,#wTut.top,#wTut.bottom{left:12px;transform:none;width:min(46%,420px);top:calc(var(--th,54px) + 14px);bottom:calc(var(--bh,90px) + 14px);max-height:none}
  #titleTxt{width:50%;top:8%}#titleTxt .t2{font-size:22px}
  #story{left:25%;width:46%;top:42%}
  #menu{left:auto;right:4%;transform:translateY(-50%);top:50%;bottom:auto;width:min(340px,46%);padding:10px}
  #menu button.mi{padding:6px 8px}#menu .foot{display:none}
  #wBoard{max-height:calc(100% - var(--th,54px) - var(--bh,90px) - 30px)}
  #wChoose{bottom:10px;padding:10px}
}
</style>
</head>
<body>
<section id="intro" class="screen crt">
  <canvas id="ic"></canvas>
  <div id="titleTxt" hidden><div class="t1">KAMPF UM</div><div class="t2">LIECHTENSTEIN</div></div>
  <div id="story"></div>
  <div id="menu" class="px" hidden>
    <button class="mi" data-m="new">NEUES SPIEL</button>
    <button class="mi" data-m="gem">DIE GEMEINDEN</button>
    <button class="mi" data-m="tut">ANLEITUNG</button>
    <button class="mi" data-m="hs">HIGHSCORE</button>
    <button class="mi" data-m="credits">CREDITS</button>
    <button class="mi" data-m="snd">TON: AN</button>
    <div class="foot">11 GEMEINDEN - 1 SIEGER</div>
  </div>
  <div id="panel" class="px" hidden></div>
  <div id="press"><div class="blink">TIPPEN ZUM STARTEN</div><small>MIT TON</small></div>
</section>

<section id="warScreen" class="screen" hidden>
  <canvas id="wc3" hidden></canvas>
  <canvas id="wc" aria-label="Karte Kampf um Liechtenstein"></canvas>
  <div id="wTip" hidden></div>
  <div id="wMsg" class="px" hidden></div>
  <div id="wChoose" class="px" hidden></div>
  <div id="wHud" class="px" hidden>
    <button class="tbtn" id="wExit" aria-label="Zum Menü">&lt;</button>
    <b id="wName"></b>
    <span class="wst" id="wTroopsBox" title="Truppen / Maximum, Wachstum pro Sekunde"><i data-spr="schwert"></i><b id="wTroops">0</b><small id="wGrow"></small></span>
    <span class="wst" id="wGoldBox" title="Gold, Einnahmen pro Sekunde"><i data-spr="gold"></i><b id="wGold">0</b><small id="wGoldR"></small></span>
    <span class="wst" id="wLandBox" title="Landanteil"><i data-spr="fahne"></i><b id="wLand">0 %</b></span>
    <span class="wst" id="wScoreBox" title="Punkte"><i data-spr="stern"></i><b id="wScore">0</b></span>
    <span id="wAtt"></span>
    <button class="tbtn" id="w3d" title="Schrägansicht (zwei Finger hoch/runter oder rechte Maustaste)">3D</button>
    <button class="tbtn" id="wHelp" title="Anleitung">?</button>
  </div>
  <div id="wBoard" class="px" hidden></div>
  <div id="wFeed"></div>
  <div id="wTut" hidden></div>
  <div id="wBanner" hidden></div>
  <div id="wBottom" class="px" hidden>
    <label class="wr"><span>ANGRIFF <b id="wRatioV">30 %</b></span><input type="range" id="wRatio" min="5" max="100" step="5" value="30"></label>
    <div id="wBuild">
      <button data-b="siedlung" title="Siedlung: +1500 max. Truppen"><i data-spr="siedlung" data-sc="3"></i><span>SIEDLUNG</span><em></em><small></small></button>
      <button data-b="burg" title="Burg: doppelte Verteidigung im Umkreis von 300 m"><i data-spr="burg" data-sc="3"></i><span>BURG</span><em></em><small></small></button>
      <button data-b="markt" title="Markt: +6 Gold pro Sekunde"><i data-spr="markt" data-sc="3"></i><span>MARKT</span><em></em><small></small></button>
      <button data-b="soeldner" title="Söldner: sofort +20 % Truppen für Gold"><i data-spr="schwert" data-sc="3"></i><span>SÖLDNER</span><em></em><small></small></button>
    </div>
  </div>
</section>

<div id="modal" hidden></div>
<div id="toasts" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/config.js?v=dev"></script>
<script src="js/data.js?v=dev"></script>
<script src="js/sprites.js?v=dev"></script>
<script src="js/gemeinden.js?v=dev"></script>
<script src="js/kampf.js?v=dev"></script>
<script src="js/war.js?v=dev"></script>
<script src="js/war3d.js?v=dev"></script>
</body>
</html>
