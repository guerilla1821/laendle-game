<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kampf um Liechtenstein</title>
<meta name="description" content="Elf Gemeinden, ein Land. Gebietsstrategie auf echten Geodaten Liechtensteins.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
:root{
  --bg:#0b0f07; --panel:#1b2413; --panel2:#26331a; --line:#55693a; --khaki:#d8c878; --olive:#7d9442; --text:#ece6c8; --dim:#a3a98a;
  --red:#d23a3a; --blue:#3a5cc8; --good:#7fc84a; --warn:#e8a83a;
  --px:"Press Start 2P", monospace; --vt:"VT323", monospace;
  --ink:#ece6c8; --muted:#a3a98a; --gold:#e8c84a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--vt);font-size:20px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.screen{position:absolute;inset:0}
/* Pixelrahmen mit abgeschnittenen Ecken */
.px{background:var(--panel);box-shadow:0 -4px 0 0 #000,0 4px 0 0 #000,-4px 0 0 0 #000,4px 0 0 0 #000,inset 0 -4px 0 0 rgba(0,0,0,.35),inset 0 4px 0 0 rgba(255,255,255,.07)}
.px-btn{font-family:var(--px);font-size:11px;line-height:1.4;background:var(--olive);color:#10150a;border:0;padding:10px 14px;box-shadow:0 -3px 0 0 #000,0 3px 0 0 #000,-3px 0 0 0 #000,3px 0 0 0 #000,inset -3px -3px 0 0 rgba(0,0,0,.35),inset 3px 3px 0 0 rgba(255,255,255,.25)}
.px-btn:hover,.px-btn:focus-visible{background:var(--khaki);outline:none}
.px-btn:active{box-shadow:0 -3px 0 0 #000,0 3px 0 0 #000,-3px 0 0 0 #000,3px 0 0 0 #000,inset 3px 3px 0 0 rgba(0,0,0,.35)}
.px-btn.red{background:var(--red);color:#fff}.px-btn.ghost{background:var(--panel2);color:var(--text)}
.px-btn:disabled{opacity:.45;cursor:default}
.px-x{position:absolute;right:8px;top:8px;width:28px;height:28px;border:0;background:var(--panel2);color:var(--text);font-family:var(--px);font-size:10px;box-shadow:0 -2px 0 0 #000,0 2px 0 0 #000,-2px 0 0 0 #000,2px 0 0 0 #000}
.trow{display:flex;gap:12px;flex-wrap:wrap}
.crt::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}

/* ---------- Intro und Menü ---------- */
#intro{background:#000;z-index:20;overflow:hidden}
#ic{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#press{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;background:#000;font-family:var(--px);font-size:12px;color:var(--khaki)}
#press .blink{animation:blink 1s steps(1) infinite}
#press small{font-family:var(--vt);font-size:20px;color:var(--dim)}
@keyframes blink{50%{opacity:0}}
#titleTxt{position:absolute;left:0;right:0;top:9%;text-align:center;font-family:var(--px);pointer-events:none}
#titleTxt .t1{font-size:clamp(12px,2.6vw,22px);color:var(--khaki);text-shadow:3px 3px 0 #000;letter-spacing:4px}
#titleTxt .t2{font-size:clamp(20px,5.6vw,52px);color:#fff;margin-top:10px;text-shadow:0 4px 0 var(--red),0 8px 0 var(--blue),4px 10px 0 #000;letter-spacing:2px}
#titleTxt.drop{animation:drop 1.1s steps(9) both}
@keyframes drop{0%{transform:translateY(-300px)}70%{transform:translateY(16px)}85%{transform:translateY(-6px)}100%{transform:none}}
#story{position:absolute;left:50%;transform:translateX(-50%);top:36%;width:min(560px,90%);text-align:center;font-family:var(--px);font-size:clamp(10px,1.6vw,14px);line-height:2.2;color:var(--text);text-shadow:2px 2px 0 #000;min-height:6em}
#menu{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);width:min(380px,92%);padding:18px 16px 14px;display:flex;flex-direction:column;gap:6px}
#menu button.mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 8px;font-family:var(--px);font-size:12px;color:var(--text)}
#menu button.mi::before{content:"►";color:transparent;width:14px}
#menu button.mi.on,#menu button.mi:hover{color:var(--khaki);background:rgba(255,255,255,.05)}
#menu button.mi.on::before,#menu button.mi:hover::before{color:var(--red);animation:blink .6s steps(1) infinite}
#menu .foot{font-size:16px;color:var(--dim);text-align:center;margin-top:6px}
#panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,94%);max-height:86%;overflow:auto;padding:22px 20px 18px;z-index:22}
#panel h2{font-family:var(--px);font-size:14px;color:var(--khaki);margin:0 0 14px;line-height:1.5}
#panel h3{font-family:var(--px);font-size:10px;color:var(--olive);margin:14px 0 4px}
#panel p{margin:0;line-height:1.15}
.hs{width:100%;border-collapse:collapse;font-size:20px}
.hs td,.hs th{padding:3px 6px;text-align:left}.hs th{font-family:var(--px);font-size:9px;color:var(--dim);font-weight:400}
.hs td.n{font-family:var(--px);font-size:12px;color:var(--khaki)}.hs td.s{text-align:right;font-variant-numeric:tabular-nums}
.hs tr.new td{background:rgba(216,200,120,.15);animation:blink 1s steps(1) 4}
.hs i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:middle}

/* ---------- Spiel ---------- */
#warScreen{background:#2a3220}
#wc{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#wTip{position:fixed;z-index:5;background:var(--panel);color:var(--text);font-size:18px;padding:6px 9px;pointer-events:none;line-height:1.05;box-shadow:0 0 0 3px #000}
#wMsg{left:50%;top:50%;transform:translate(-50%,-50%);padding:18px 20px;max-width:360px;text-align:center;line-height:1.1;position:absolute}
#wChoose{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:14px;display:flex;flex-direction:column;gap:8px;width:min(640px,calc(100% - 32px))}
#wChoose b{font-family:var(--px);font-size:11px;color:var(--khaki);font-weight:400}#wChoose span{color:var(--dim);font-size:18px}
.wgems{display:flex;flex-wrap:wrap;gap:8px}
.wgems button{border:0;background:var(--panel2);color:var(--text);padding:6px 9px;font-family:var(--px);font-size:9px;box-shadow:0 0 0 3px #000,inset 0 -4px 0 0 var(--c)}
.wgems button:hover{background:var(--c);color:#000}
#wHud{position:absolute;top:10px;left:10px;right:10px;display:flex;align-items:center;gap:14px;padding:6px 10px;flex-wrap:nowrap}
#wHud .wst{white-space:nowrap;font-size:20px}#wHud .wst b{font-weight:400;color:#fff}
#wName{font-family:var(--px);font-size:11px;font-weight:400}
#wGrow,#wGoldR{font-size:17px;color:var(--good)}#wGrow.full{color:var(--red);animation:blink 1s steps(1) infinite}
#wAtt{font-size:17px;color:var(--red)}
#wScoreBox b{color:var(--khaki)!important}
.tbtn{border:0;background:var(--panel2);color:var(--text);height:32px;min-width:32px;padding:0 9px;font-family:var(--px);font-size:11px;box-shadow:0 0 0 3px #000}
#wHelp{margin-left:auto}
#wBoard{position:absolute;top:66px;right:10px;padding:8px 10px;font-size:18px;min-width:200px;max-height:calc(100% - 200px);overflow:auto}
#wBoard div{display:flex;align-items:center;gap:6px;padding:1px 0;cursor:pointer}
#wBoard i{width:10px;height:10px;flex:none}#wBoard em{font-style:normal;color:var(--dim);min-width:22px}
#wBoard span{margin-left:auto;font-variant-numeric:tabular-nums}#wBoard .tr{min-width:42px;text-align:right;color:var(--dim)}
#wBoard .me{color:var(--khaki)}#wBoard .dead{opacity:.4}
#wBoard div button{border:0;background:var(--panel2);font-size:13px;padding:1px 5px;margin-left:4px;box-shadow:0 0 0 2px #000}
#wBoard .pact{color:var(--good)}#wBoard .trait{color:var(--red)}
#wBoard .more{display:block;width:100%;border:0;background:none;color:var(--khaki);font-family:var(--px);font-size:9px;padding:6px 0 0;text-align:left}
#wBoard .goal{color:var(--dim);border-top:2px dashed var(--line);margin-top:4px;padding-top:4px;cursor:default}
#wFeed{position:absolute;left:12px;top:66px;display:flex;flex-direction:column;gap:5px;pointer-events:none;max-width:min(380px,60%)}
#wFeed div{background:rgba(11,15,7,.88);color:var(--text);font-size:18px;line-height:1;padding:5px 9px;box-shadow:0 0 0 2px #000;transition:opacity 1s}
#wFeed div.bad{background:rgba(160,30,30,.92)}#wFeed div.good{background:rgba(70,120,40,.95)}#wFeed div.warn{background:rgba(170,110,20,.95)}#wFeed div.old{opacity:.35}
#wFeed div.ask{background:var(--panel2);border:0;box-shadow:0 0 0 3px var(--khaki);pointer-events:auto}
#wFeed div.ask button{border:0;background:var(--olive);color:#000;font-family:var(--px);font-size:9px;padding:4px 7px;margin-left:6px;box-shadow:0 0 0 2px #000}
#wFeed div.ask button.no{background:var(--panel)}
#wBottom{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:16px;align-items:center;padding:8px 12px;width:max-content;max-width:calc(100% - 24px)}
.wr{display:flex;flex-direction:column;font-size:18px;gap:2px;min-width:160px}.wr b{font-weight:400;color:var(--khaki)}
.wr input{width:100%;accent-color:var(--red)}
#wBuild{display:flex;gap:8px}
#wBuild button{display:flex;flex-direction:column;align-items:center;border:0;background:var(--panel2);padding:4px 8px;font-size:20px;min-width:70px;box-shadow:0 0 0 3px #000}
#wBuild button span{font-family:var(--px);font-size:8px;margin-top:2px}#wBuild button em{font-style:normal;font-size:15px;color:var(--dim);white-space:nowrap}#wBuild button small{font-size:16px;color:var(--gold)}
#wBuild button[aria-pressed="true"]{background:#4a3a14;box-shadow:0 0 0 3px var(--khaki)}#wBuild button:disabled{opacity:.4}
#wTut{position:absolute;left:50%;transform:translateX(-50%);width:min(430px,calc(100% - 24px));padding:16px 18px 14px;z-index:6;border-top:6px solid var(--khaki)}
#wTut.top{top:64px}#wTut.bottom{bottom:110px}
#wTut h3{margin:2px 30px 8px 0;font-family:var(--px);font-size:12px;line-height:1.5;color:var(--khaki);font-weight:400}
#wTut p{margin:0 0 12px;line-height:1.05;font-size:20px}#wTut .tn{font-family:var(--px);font-size:8px;color:var(--dim)}
.tutHi{outline:3px dashed var(--khaki)!important;outline-offset:4px;position:relative;z-index:5;animation:hi 1s steps(2) infinite}
@keyframes hi{50%{outline-color:var(--red)}}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:30;padding:16px}
.mcard{width:min(520px,100%);max-height:calc(100% - 32px);overflow:auto;padding:22px 20px 18px;display:flex;flex-direction:column;gap:12px}
.mcard h2{margin:0;font-family:var(--px);font-size:16px;line-height:1.5;font-weight:400}
.mcard h2.win{color:var(--khaki)}.mcard h2.lose{color:var(--red)}
.sc{display:grid;grid-template-columns:1fr auto;gap:2px 14px;font-size:21px}.sc b{font-weight:400;text-align:right;font-variant-numeric:tabular-nums}
.sc .tot{font-family:var(--px);font-size:13px;color:var(--khaki);margin-top:6px}
.ini{display:flex;gap:10px;align-items:center;font-family:var(--px);font-size:11px;color:var(--khaki)}
.ini input{width:96px;font-family:var(--px);font-size:18px;text-transform:uppercase;letter-spacing:6px;background:#000;color:var(--khaki);border:0;padding:8px;box-shadow:0 0 0 3px var(--olive);text-align:center}
#toasts{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:40;pointer-events:none;align-items:center}
.toast{background:var(--panel);color:var(--text);font-size:19px;padding:6px 12px;box-shadow:0 0 0 3px #000;animation:tin .2s steps(3)}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
#sndBtn{position:absolute;right:12px;top:12px;z-index:25}
@media(max-width:700px){
  html,body{font-size:18px}
  #wHud{gap:6px;padding:5px 6px}#wHud .wst{font-size:15px}#wGrow{font-size:14px}#wName,#wAtt,#wGoldR,#wLandBox{display:none}.tbtn{min-width:28px;padding:0 6px}#wExit{order:-2}#wHelp{order:-1;margin-left:0}#wScoreBox{margin-left:auto}
  #wBuild button em{display:none}.hs{font-size:16px}.hs td.n{font-size:10px}
  #wBoard{top:auto;bottom:128px;right:8px;min-width:0;font-size:16px;padding:6px 8px;max-height:45%}
  #wBoard.open{top:60px;bottom:auto;max-height:calc(100% - 210px);z-index:4}
  #wFeed{top:auto;bottom:128px;left:8px;max-width:52%}#wFeed div{font-size:15px;padding:4px 7px}#wFeed div:nth-child(n+3){display:none}
  #wBottom{left:8px;right:8px;transform:none;width:auto;flex-direction:column;align-items:stretch;gap:8px;bottom:8px}
  #wBuild button{flex:1}
  #wTut.bottom{bottom:136px}#wTut.top{top:58px}#wTut{max-height:calc(100% - 220px);overflow:auto}
  #menu button.mi{font-size:11px;padding:8px 6px}
}
</style>
</head>
<body>
<section id="intro" class="screen crt">
  <canvas id="ic"></canvas>
  <div id="titleTxt" hidden><div class="t1">KAMPF UM</div><div class="t2">LIECHTENSTEIN</div></div>
  <div id="story"></div>
  <div id="menu" class="px" hidden>
    <button class="mi" data-m="new">NEUES SPIEL</button>
    <button class="mi" data-m="tut">ANLEITUNG</button>
    <button class="mi" data-m="hs">HIGHSCORE</button>
    <button class="mi" data-m="snd">TON: AN</button>
    <button class="mi" data-m="home">ZURÜCK INS LÄNDLE</button>
    <div class="foot">Echte Geodaten · 11 Gemeinden · 1 Sieger</div>
  </div>
  <div id="panel" class="px" hidden></div>
  <div id="press"><div class="blink">▶ TIPPEN ZUM STARTEN</div><small>mit Ton</small></div>
</section>

<section id="warScreen" class="screen" hidden>
  <canvas id="wc" aria-label="Karte Kampf um Liechtenstein"></canvas>
  <div id="wTip" hidden></div>
  <div id="wMsg" class="px" hidden></div>
  <div id="wChoose" class="px" hidden></div>
  <div id="wHud" class="px" hidden>
    <button class="tbtn" id="wExit" aria-label="Zum Menü">‹</button>
    <b id="wName"></b>
    <span class="wst" id="wTroopsBox" title="Truppen / Maximum, Wachstum pro Sekunde">⚔ <b id="wTroops">0</b> <small id="wGrow"></small></span>
    <span class="wst" id="wGoldBox" title="Gold, Einnahmen pro Sekunde">● <b id="wGold">0</b> <small id="wGoldR"></small></span>
    <span class="wst" id="wLandBox" title="Landanteil">▦ <b id="wLand">0 %</b></span>
    <span class="wst" id="wScoreBox" title="Punkte">★ <b id="wScore">0</b></span>
    <span id="wAtt"></span>
    <button class="tbtn" id="wHelp" title="Anleitung">?</button>
  </div>
  <div id="wBoard" class="px" hidden></div>
  <div id="wFeed"></div>
  <div id="wTut" class="px" hidden></div>
  <div id="wBottom" class="px" hidden>
    <label class="wr"><span>Angriffsstärke <b id="wRatioV">30 %</b></span><input type="range" id="wRatio" min="5" max="100" step="5" value="30"></label>
    <div id="wBuild">
      <button data-b="siedlung" title="Siedlung: +1500 max. Truppen">🏘️<span>SIEDLUNG</span><em></em><small></small></button>
      <button data-b="burg" title="Burg: doppelte Verteidigung im Umkreis von 300 m">🏰<span>BURG</span><em></em><small></small></button>
      <button data-b="markt" title="Markt: +6 Gold pro Sekunde">💰<span>MARKT</span><em></em><small></small></button>
    </div>
  </div>
</section>

<div id="modal" hidden></div>
<div id="toasts" aria-live="polite"></div>

<script src="js/config.js?v=dev"></script>
<script src="js/data.js?v=dev"></script>
<script src="js/kampf.js?v=dev"></script>
<script src="js/war.js?v=dev"></script>
</body>
</html>
